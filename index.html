<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="timerCard">

        <div id="modeButtons">
            <button type ="button" class="modeBtn active" data-mode="pomodoro">Pomodoro</button>
            <button type ="button" class="modeBtn" data-mode="shortBreak">Short Break</button>
            <button type ="button" class="modeBtn" data-mode="longBreak">Long Break</button>
        </div>

        <p id="timer">25:00</p>
        
        <p id="message"></p>

        <div id="controls">
            <button id="startButton">START</button>
            <button id="nextButton"> ⏭ </button>
        </div>

    </div>

<script src="index.js"></script>
</body>
</html>
